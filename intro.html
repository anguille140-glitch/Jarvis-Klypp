<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : une seule scène plein écran (canvas 1920×1080 mis à l'échelle), commandes posées dessus. */
:root {
  color-scheme: dark;
  --void: #02060b;         /* fond */
  --ion: #3fd8ff;          /* cyan principal */
  --ice: #d9f6ff;          /* blanc glacé */
  --ember: #ffad42;        /* accent orange (repris de l'intro actuelle) */
  --steel: #2b5a6e;        /* traits secondaires */
  --display: "Oxanium", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ice); font-family: var(--mono); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.veil {
  position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px;
  background: radial-gradient(60% 60% at 50% 45%, rgba(10, 40, 60, .55), rgba(2, 6, 11, .92));
  transition: opacity .5s ease;
}
.veil[hidden] { display: none !important; }
.card { max-width: 440px; text-align: center; display: grid; gap: 18px; justify-items: center; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(26px, 5vw, 40px);
  letter-spacing: .32em; color: var(--ice); text-wrap: balance; padding-left: .32em; }
.card p { margin: 0; color: #8fb6c6; font-size: 14px; line-height: 1.6; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  font-family: var(--display); font-size: 15px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--void); background: var(--ion); border: 0; border-radius: 2px; padding: 13px 22px; cursor: pointer;
  box-shadow: 0 0 24px rgba(63, 216, 255, .45);
}
button.ghost { background: transparent; color: var(--ion); box-shadow: inset 0 0 0 1px rgba(63, 216, 255, .55); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
.hint { position: fixed; right: 16px; bottom: 12px; font-size: 11px; letter-spacing: .12em; color: #4f7586; text-transform: uppercase; }
</style>

<canvas id="c" aria-label="Animation d'intro Jarvis"></canvas>
<div class="veil" id="veil">
  <div class="card">
    <h1>J.A.R.V.I.S</h1>
    <p>Démo de la nouvelle intro, 10 secondes, avec le son de démarrage. La voix ElevenLabs et le deuxième écran s'ajoutent dans la vraie version.</p>
    <div class="row">
      <button id="play">Lancer l'intro</button>
      <button id="full" class="ghost">Plein écran</button>
    </div>
  </div>
</div>

const C = { void: "#02060b", ion: "#3fd8ff", ice: "#d9f6ff", ember: "#ffad42", steel: "#2b5a6e", deep: "#0a2230" };
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

let W = 0, H = 0, dpr = 1, sc = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  sc = Math.min(W / 1920, H / 1080); ox = (W - 1920 * sc) / 2; oy = (H - 1080 * sc) / 2;

addEventListener("resize", resize); resize();

// ---------- outils
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const out3 = k => 1 - Math.pow(1 - k, 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- son de démarrage (même recette que jarvis.py : montée 90 → 1500 Hz en 1,3 s puis carillon)
let actx = null, analyser = null, freqData = null;
function bootSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const a = actx, t0 = a.currentTime + 0.05;
    const master = a.createGain(); master.gain.value = 0.55;
    analyser = a.createAnalyser(); analyser.fftSize = 256; freqData = new Uint8Array(analyser.frequencyBinCount);
    const delayIn = a.createGain();
    [[.17, .35], [.34, .22], [.51, .12]].forEach(([d, g]) => {
      const dl = a.createDelay(1); dl.delayTime.value = d; const gg = a.createGain(); gg.gain.value = g;
      delayIn.connect(dl); dl.connect(gg); gg.connect(master);
    });
    delayIn.connect(master); master.connect(analyser); analyser.connect(a.destination);
    [[1, 1, .5], [2.01, .45, .5], [3.02, .25, .5]].forEach(([mul, amp]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.setValueAtTime(90 * mul, t0); o.frequency.exponentialRampToValueAtTime(1500 * mul, t0 + T_CHARGE);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * .5, t0 + T_CHARGE);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + T_CHARGE + 0.9);
      o.connect(g); g.connect(delayIn); o.start(t0); o.stop(t0 + T_CHARGE + 1);
    });
    const sub = a.createOscillator(), sg = a.createGain(); sub.frequency.value = 55;
    sg.gain.setValueAtTime(0.0001, t0); sg.gain.exponentialRampToValueAtTime(.6, t0 + T_CHARGE);
    sg.gain.exponentialRampToValueAtTime(0.0001, t0 + T_CHARGE + 1.6);
    sub.connect(sg); sg.connect(delayIn); sub.start(t0); sub.stop(t0 + T_CHARGE + 1.7);
    [880, 1318.5, 1760].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain(), ts = t0 + T_CHARGE - .05 + i * .07;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.setValueAtTime(.55 - .1 * i, ts);
      g.gain.exponentialRampToValueAtTime(0.0001, ts + 1.4); o.connect(g); g.connect(delayIn); o.start(ts); o.stop(ts + 1.5);
    });
  } catch (e) { /* pas de son : l'animation tourne quand même */ }
}

// ---------- éléments
const dust = Array.from({ length: 90 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, r: .6 + rnd() * 1.6, v: 4 + rnd() * 10, a: .15 + rnd() * .35 }));
const stream = Array.from({ length: 140 }, () => ({ a: rnd() * TAU, d: 380 + rnd() * 520, s: .5 + rnd(), w: .6 + rnd() * 1.4 }));
const graphA = Array.from({ length: 64 }, (_, i) => .5 + .25 * Math.sin(i * .45) + .15 * (rnd() - .5));
const graphB = Array.from({ length: 64 }, (_, i) => .45 + .2 * Math.cos(i * .3 + 1) + .15 * (rnd() - .5));
const GLYPHS = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#/<>*";
const CX = 960, CY = 470;

function text(s, x, y, size, color, { font = "mono", weight = 400, align = "left", spacing = 0, alpha = 1, glow = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font === "display" ? '"Oxanium", "Segoe UI", sans-serif' : '"IBM Plex Mono", Consolas, monospace'}`;
  ctx.fillStyle = color; ctx.textBaseline = "middle";
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (spacing) {
    const chars = [...s]; const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((p, w) => p + w, 0) + spacing * (chars.length - 1);
    let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
    ctx.textAlign = "left";
    chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += widths[i] + spacing; });
  } else { ctx.textAlign = align; ctx.fillText(s, x, y); }
  ctx.restore();
}

function arc(r, a0, a1, color, w, alpha = 1, glow = 0) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.beginPath(); ctx.arc(CX, CY, r, a0, a1); ctx.stroke(); ctx.restore();
}

function panel(x, y, w, h, k, title) {
  // panneau en verre : coins coupés, trait fin, apparition par balayage
  if (k <= 0) return false;
  const e = out3(k), cut = 14;
  ctx.save();
  ctx.globalAlpha *= e;
  ctx.beginPath();
  const ww = w * e;
  ctx.moveTo(x + cut, y); ctx.lineTo(x + ww, y); ctx.lineTo(x + ww, y + h - cut); ctx.lineTo(x + ww - cut, y + h);
  ctx.lineTo(x, y + h); ctx.lineTo(x, y + cut); ctx.closePath();
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, "rgba(16, 52, 72, .42)"); g.addColorStop(1, "rgba(6, 20, 30, .30)");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = rgba(C.ion, .35); ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = C.ion; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y + cut + 26); ctx.lineTo(x, y + cut); ctx.lineTo(x + cut, y); ctx.lineTo(x + 60, y); ctx.stroke();
  ctx.restore();
  if (title) text(title, x + 24, y + 30, 13, C.ember, { spacing: 2.4, alpha: e, weight: 500 });
  return e;
}

function smoothLine(pts, x, y, w, h, color, alpha, shift) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.beginPath();
  const n = pts.length, step = w / (n - 1);
  const P = i => [x + i * step, y + h - h * pts[(i + shift) % n]];
  let [px, py] = P(0); ctx.moveTo(px, py);
  for (let i = 1; i < n; i++) { const [nx, ny] = P(i); const mx = (px + nx) / 2, my = (py + ny) / 2; ctx.quadraticCurveTo(px, py, mx, my); px = nx; py = ny; }
  ctx.stroke();
  ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, rgba(color, .18)); g.addColorStop(1, rgba(color, 0));
  ctx.shadowBlur = 0; ctx.fillStyle = g; ctx.fill(); ctx.restore();
}

// ---------- une image
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.void; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, ox * dpr, oy * dpr);

  const outK = seg(t, D - 1.4, D - 0.25);            // repli final
  const live = 1 - ease(outK);
  const charge = clamp(t / T_CHARGE);                  // 0 → 1, comme la note du son
  const impact = seg(t, T_CHARGE, T_CHARGE + 0.9);

  // fond : halo + grille en perspective
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1100);
  bg.addColorStop(0, rgba("#0b2a3c", .55 * live + .1)); bg.addColorStop(1, rgba(C.void, 0));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 1920, 1080);
  const gridK = ease(seg(t, 0, .6)) * live;
  ctx.save(); ctx.globalAlpha = .22 * gridK; ctx.strokeStyle = C.steel; ctx.lineWidth = 1;
  for (let i = -16; i <= 16; i++) { ctx.beginPath(); ctx.moveTo(CX + i * 34, 760); ctx.lineTo(CX + i * 210, 1080); ctx.stroke(); }
  for (let j = 0; j < 9; j++) { const yy = 760 + Math.pow(j / 8, 1.8) * 320 + ((t * 18) % 40) * (j / 8); ctx.globalAlpha = .18 * gridK * (j / 8); ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(1920, yy); ctx.stroke(); }
  ctx.restore();
  // poussière
  ctx.save(); dust.forEach(p => { const y = (p.y - t * p.v + 1080) % 1080; ctx.globalAlpha = p.a * live * gridK; ctx.fillStyle = C.ion; ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, TAU); ctx.fill(); }); ctx.restore();

  // balayage de démarrage
  if (t < .7) { const k = seg(t, 0, .7), y = lerp(-20, 1100, ease(k)); const g = ctx.createLinearGradient(0, y - 80, 0, y); g.addColorStop(0, rgba(C.ion, 0)); g.addColorStop(1, rgba(C.ion, .35 * (1 - k))); ctx.fillStyle = g; ctx.fillRect(0, y - 80, 1920, 80); ctx.fillStyle = rgba(C.ice, .8 * (1 - k)); ctx.fillRect(0, y, 1920, 2); }

  // cadre : coins + barre du haut
  const frameK = ease(seg(t, .2, 1.2)) * live;
  ctx.save(); ctx.globalAlpha = frameK; ctx.strokeStyle = rgba(C.ion, .6); ctx.lineWidth = 2;
  [[60, 50, 1, 1], [1860, 50, -1, 1], [60, 1030, 1, -1], [1860, 1030, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.beginPath(); ctx.moveTo(x, y + sy * 70); ctx.lineTo(x, y); ctx.lineTo(x + sx * 70, y); ctx.stroke(); });
  ctx.strokeStyle = rgba(C.ion, .25); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(150, 100); ctx.lineTo(880, 100); ctx.lineTo(900, 112); ctx.lineTo(1020, 112); ctx.lineTo(1040, 100); ctx.lineTo(1770, 100); ctx.stroke();
  ctx.restore();
  const now = new Date(), hh = now.toLocaleTimeString("fr-FR"), dd = now.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  text("JARVIS  //  PROTOCOLE DE RÉVEIL", 150, 78, 14, C.ion, { spacing: 2, alpha: frameK, weight: 500 });
  text(hh, 1770, 72, 22, C.ice, { align: "right", alpha: frameK, font: "display", weight: 500 });
  text(dd.toUpperCase(), 1770, 88 + 4, 11, "#6f98aa", { align: "right", spacing: 1.5, alpha: frameK });

  // ---------- le noyau : il part du bord gauche (ton 2e écran) et traverse jusqu'au centre
  const coreR = 205;
  const k = charge;                                   // avancement = hauteur de la note du son
  const travelling = t < T_CHARGE;
  // solo : du bord gauche au centre ; main : seconde moitié du trajet (le rond arrive du 2e écran)
  const part = k2 => ROLE === "main" ? clamp((k2 - .5) * 2) : k2;
  const TX = k2 => lerp(ROLE === "main" ? -260 : -240, CX, part(k2));
  const TY = k2 => CY - (ROLE === "main" ? 60 : 90) * Math.sin(Math.PI * (ROLE === "main" ? .5 + part(k2) / 2 : k2));
  const tx = TX(k), ty = TY(k);
  const onScreen = ROLE !== "main" || k > .5;
  const railA = (1 - ease(seg(t, T_CHARGE + .2, T_CHARGE + .9))) * ease(seg(t, 0, .35));
  // rail de transfert
  if (railA > 0) {
    ctx.save(); ctx.globalAlpha = railA;
    ctx.strokeStyle = rgba(C.steel, .55); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, CY); ctx.lineTo(CX - 330, CY); ctx.stroke();
    for (let x = 0; x <= CX - 330; x += 32) { const big = (x / 32) % 5 === 0; ctx.strokeStyle = rgba(big ? C.ion : C.steel, big ? .6 : .45); ctx.beginPath(); ctx.moveTo(x, CY - (big ? 9 : 4)); ctx.lineTo(x, CY + (big ? 9 : 4)); ctx.stroke(); }
    const fill = Math.min(tx, CX - 330);
    const g = ctx.createLinearGradient(0, 0, fill, 0); g.addColorStop(0, rgba(C.ion, .1)); g.addColorStop(1, C.ion);
    ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.shadowColor = C.ion; ctx.shadowBlur = 14; ctx.beginPath(); ctx.moveTo(0, CY); ctx.lineTo(Math.max(0, fill), CY); ctx.stroke();
    ctx.restore();
    text(ROLE === "main" ? "RÉCEPTION DU NOYAU  ·  ÉCRAN 2  →  ÉCRAN PRINCIPAL" : "TRANSFERT DU NOYAU  ·  ÉCRAN 2  →  ÉCRAN PRINCIPAL", 40, CY + 270, 12, C.ion, { spacing: 2.5, alpha: railA * .9, weight: 500 });
  }
  // traînée de particules derrière le rond
  if (travelling || t < T_CHARGE + .5) {
    const ta = 1 - seg(t, T_CHARGE, T_CHARGE + .5);
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    stream.forEach((p, i) => {
      const back = ((p.d - 380) / 520) * .32;           // retard le long du trajet
      const kk = clamp(k - back); if (kk <= 0 || (ROLE === "main" && kk <= .5)) return;
      const jit = (p.a / TAU - .5) * 120 * (back / .32);
      const x = TX(kk) - 20, y = TY(kk) + jit;
      const a = .6 * ta * (1 - back / .32);
      ctx.strokeStyle = rgba(C.ion, a); ctx.lineWidth = p.w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 30 * p.s, y); ctx.stroke();
    });
    ctx.restore();
  }
  // anneaux du centre : ils s'allument en attendant le noyau
  const ringIn = ease(seg(t, .05, 1.1)) * live;
  const spin = t * .35;
  const R = r => r * (1 - .85 * ease(outK));
  ctx.save(); ctx.globalAlpha = ringIn;
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * TAU - Math.PI / 2; if (i / 120 > charge + .002 && travelling) continue;
    const big = i % 10 === 0, r0 = R(322), r1 = R(big ? 342 : 332);
    ctx.strokeStyle = rgba(big ? C.ice : C.ion, big ? .75 : .35); ctx.lineWidth = big ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0); ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
  const pa = -Math.PI / 2;
  arc(R(300), pa, pa + TAU * Math.max(.001, travelling ? charge : 1), C.ion, travelling ? 2 : 4, ringIn * (travelling ? .55 : 1), travelling ? 6 : 18);
  [[262, 1.1, .9, C.ion, 2], [248, -.7, 2.2, C.steel, 6], [372, .25, .45, C.ion, 1.5], [358, -.18, 1.6, C.ember, 2]].forEach(([r, v, len, col, w], i) => {
    const a0 = spin * v * 2 + i * 1.7;
    for (let q = 0; q < 3; q++) arc(R(r), a0 + q * TAU / 3, a0 + q * TAU / 3 + len * .5, col, w, ringIn * (col === C.ember ? .85 : .7));
  });
  // le rond (ton image)
  if (img.complete && img.naturalWidth) {
    const docked = !travelling;
    const px = docked ? CX : tx, py = docked ? CY : ty;
    const s = (docked ? 1 + .03 * Math.sin(t * 2.2) + .07 * Math.exp(-impact * 5) : lerp(.5, .8, k)) * (1 - .9 * ease(outK));
    const size = 2 * coreR * s;
    // fantômes (traînée de l'image)
    if (travelling && onScreen) for (let gI = 3; gI >= 1; gI--) {
      const kk = clamp(k - gI * .035), gs = size * (1 - gI * .06);
      ctx.save(); ctx.globalAlpha = .12 * (4 - gI) / 3; ctx.translate(TX(kk), TY(kk)); ctx.rotate(-t * .9);
      ctx.drawImage(img, -gs / 2, -gs / 2, gs, gs); ctx.restore();
    }
    if (onScreen || !travelling) {
    ctx.save(); ctx.translate(px, py); ctx.rotate(travelling ? -t * .9 : -t * .12);
    ctx.globalAlpha = (travelling ? lerp(.7, 1, k) : 1) * (1 - ease(seg(t, D - .55, D - .25)));
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
    if (docked) { ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha *= .35 + .25 * Math.sin(t * 3) ** 2; ctx.filter = "blur(10px)"; ctx.drawImage(img, -size / 2, -size / 2, size, size); ctx.filter = "none"; }
    ctx.restore();
    }
    // pendant le trajet : anneau de progression + pourcentage qui suivent le rond
    if (travelling && onScreen) {
      const rr = size * .62;
      ctx.save(); ctx.strokeStyle = rgba(C.steel, .5); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, rr, 0, TAU); ctx.stroke();
      ctx.strokeStyle = C.ion; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.shadowColor = C.ion; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(px, py, rr, pa, pa + TAU * Math.max(.001, k)); ctx.stroke(); ctx.restore();
    }
  }
  // pourcentage : sous le rond pendant le trajet, puis « NOYAU INSTALLÉ » au centre, qui s'efface
  if (travelling && onScreen) {
    const s = lerp(.5, .8, k), py = ty + 2 * coreR * s * .62 + 46;
    text(`${Math.round(k * 100)} %`, tx, py, 34, C.ice, { align: "center", font: "display", weight: 500, glow: 14 });
    text("CHARGEMENT", tx, py + 34, 12, C.ion, { align: "center", spacing: 3 });
  } else if (!travelling) {
    const a = 1 - ease(seg(t, T_CHARGE + .5, T_CHARGE + 1));
    if (a > 0) {
      text("100 %", CX, CY - 8, 64, C.ice, { align: "center", font: "display", weight: 300, alpha: a, glow: 22 });
      text("NOYAU INSTALLÉ", CX, CY + 46, 13, C.ion, { align: "center", spacing: 3, alpha: a });
    }
  }
  // impact : onde + éclair
  if (impact > 0 && impact < 1) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    [0, .18].forEach(d => { const k = clamp((impact - d) / (1 - d)); if (k <= 0) return; ctx.strokeStyle = rgba(C.ion, .8 * (1 - k)); ctx.lineWidth = 6 * (1 - k) + 1; ctx.shadowColor = C.ion; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(CX, CY, lerp(220, 980, out3(k)), 0, TAU); ctx.stroke(); });
    const fl = ctx.createRadialGradient(CX, CY, 0, CX, CY, 900); fl.addColorStop(0, rgba(C.ice, .5 * Math.exp(-impact * 6))); fl.addColorStop(1, rgba(C.ion, 0));
    ctx.fillStyle = fl; ctx.fillRect(0, 0, 1920, 1080); ctx.restore();
  }

  // ---------- titre (décodage lettre par lettre)
  const TITLE = "J.A.R.V.I.S";
  const tt = t - (T_CHARGE + .45);
  if (tt > 0) {
    const titleA = live;
    let shown = "";
    [...TITLE].forEach((ch, i) => { const k = tt - i * .06; shown += k < 0 ? " " : k < .32 ? GLYPHS[Math.floor((t * 30 + i * 7) % GLYPHS.length)] : ch; });
    text(shown, CX, 862, 62, C.ice, { align: "center", font: "display", weight: 500, spacing: 22, alpha: titleA, glow: 18 });
    const sub = `BIENVENUE, ${USER}`, k2 = clamp((tt - .9) * 18 / sub.length);
    text(sub.slice(0, Math.round(k2 * sub.length)), CX, 918, 20, C.ember, { align: "center", spacing: 6, alpha: titleA, weight: 500 });
    text("TOUS LES SYSTÈMES SONT EN LIGNE", CX, 954, 12, "#6f98aa", { align: "center", spacing: 3, alpha: titleA * ease(seg(tt, 1.6, 2.2)) });
  }

  // ---------- panneau gauche : séquence
  const lk = seg(t, 1.55, 2.25) * live;
  const le = panel(110, 170, 470, 300, lk, "SÉQUENCE D'INITIALISATION");
  if (le) {
    const rows = [["SYSTÈME", 1.9, "OK"], ["VOIX", 2.35, "OK"], ["DISCORD", 2.8, "ÉCRAN 2"], ["FACEIT", 3.3, "CONNECTÉ"]];
    rows.forEach(([lab, at, st], i) => {
      const y = 232 + i * 54, k = seg(t, at, at + .45), done = t > at + .45;
      text(lab, 134, y, 16, done ? C.ice : "#6f98aa", { alpha: le, spacing: 2, weight: 500 });
      ctx.save(); ctx.globalAlpha = le; ctx.fillStyle = rgba(C.steel, .6); ctx.fillRect(290, y - 1, 150, 2);
      ctx.fillStyle = C.ion; ctx.shadowColor = C.ion; ctx.shadowBlur = 10; ctx.fillRect(290, y - 1, 150 * ease(k), 2); ctx.restore();
      if (done) {
        text(st, 556, y, 14, i === 3 ? C.ember : C.ion, { align: "right", alpha: le, spacing: 1.5, weight: 500 });
      } else if (k > 0) text("…", 556, y, 14, "#6f98aa", { align: "right", alpha: le });
    });
  }
  // jauges système
  const gk = seg(t, 2.1, 2.8) * live;
  const ge = panel(110, 500, 470, 250, gk, "RESSOURCES");
  if (ge) {
    [["PROCESSEUR", .34, 1.3], ["MÉMOIRE", .41, .7], ["RÉSEAU", .63, 2.1], ["MICRO", .38, 3.2]].forEach(([lab, base, f], i) => {
      const y = 560 + i * 44, v = clamp(base + .12 * Math.sin(t * f + i)) * ease(seg(t, 2.2 + i * .1, 3));
      text(lab, 134, y, 13, "#8fb6c6", { alpha: ge, spacing: 1.5 });
      ctx.save(); ctx.globalAlpha = ge; ctx.fillStyle = rgba(C.steel, .45); ctx.fillRect(290, y - 3, 200, 6);
      const g = ctx.createLinearGradient(290, 0, 490, 0); g.addColorStop(0, rgba(C.ion, .4)); g.addColorStop(1, C.ion);
      ctx.fillStyle = g; ctx.fillRect(290, y - 3, 200 * v, 6); ctx.restore();
      text(`${Math.round(v * 100)} %`, 556, y, 13, C.ice, { align: "right", alpha: ge });
    });
  }

  // ---------- panneau droit : FACEIT
  const rk = seg(t, 1.75, 2.45) * live;
  const re = panel(1340, 170, 470, 300, rk, `FACEIT  ·  ${NICK.toUpperCase()}`);
  if (re) {
    if (!HAS_FACEIT) { text("STATISTIQUES INDISPONIBLES", 1364, 300, 14, "#6f98aa", { alpha: re, spacing: 2 }); }
    else {
    const elo = Math.round(FACEIT.elo * out3(seg(t, 2.1, 3.3)));
    // niveau FACEIT aux couleurs du site : 1 blanc · 2-3 vert · 4-7 jaune · 8-9 orange · 10 rouge
    const lvl = clamp(FACEIT.level, 1, 10), col = faceitColor(lvl);
    const lo = FACEIT_STEPS[lvl - 1], hi = FACEIT_STEPS[lvl];
    const prog = lvl >= 10 ? 1 : clamp((FACEIT.elo - lo) / (hi - lo));
    const gk = out3(seg(t, 2.2, 3.4));
    text("ELO", 1364, 230, 12, "#6f98aa", { alpha: re, spacing: 2 });
    const eloTxt = elo.toLocaleString("fr-FR");
    text(eloTxt, 1364, 282, 64, C.ice, { alpha: re, font: "display", weight: 500, glow: 14 });
    // badge juste à droite du nombre (largeur du nombre final, pour qu'il ne bouge pas pendant le comptage)
    ctx.save(); ctx.font = '500 64px "Oxanium", "Segoe UI", sans-serif';
    const eloW = ctx.measureText(FACEIT.elo.toLocaleString("fr-FR")).width; ctx.restore();
    const bx = Math.min(1740, 1364 + eloW + 62), by = 280, br = 34, a0 = Math.PI * .75, span = Math.PI * 1.5;
    if (lvlImg.ok) {                                       // image fournie par l'utilisateur (faceit_niveau.png)
      const sz = 86, k = ease(seg(t, 2.2, 2.7));
      ctx.save(); ctx.globalAlpha = re * k; ctx.drawImage(lvlImg.el, bx - sz / 2, by - sz / 2, sz, sz); ctx.restore();
    } else {
    // badge rond : jauge de progression dans le niveau + chiffre au centre
    ctx.save(); ctx.globalAlpha = re;
    ctx.fillStyle = "rgba(8, 18, 26, .9)"; ctx.beginPath(); ctx.arc(bx, by, br + 8, 0, TAU); ctx.fill();
    ctx.lineCap = "round"; ctx.lineWidth = 6;
    ctx.strokeStyle = rgba(col, .18); ctx.beginPath(); ctx.arc(bx, by, br, a0, a0 + span); ctx.stroke();
    ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(bx, by, br, a0, a0 + span * Math.max(.02, prog * gk)); ctx.stroke();
    ctx.restore();
    text(String(lvl), bx, by + 1, 30, col, { align: "center", font: "display", weight: 700, alpha: re * ease(seg(t, 2.2, 2.6)), glow: 12 });
    }
    text(`NIVEAU ${lvl}`, 1786, 230, 12, col, { align: "right", spacing: 2.5, alpha: re, weight: 500 });
    // barre des 10 niveaux
    for (let i = 0; i < 10; i++) {
      const on = i < lvl && seg(t, 2.3 + i * .07, 2.4 + i * .07) > 0;
      ctx.save(); ctx.globalAlpha = re; ctx.fillStyle = on ? (i === lvl - 1 ? col : rgba(col, .55)) : rgba(C.steel, .5);
      if (on && i === lvl - 1) { ctx.shadowColor = col; ctx.shadowBlur = 12; }
      ctx.fillRect(1364 + i * 43, 338, 36, 8); ctx.restore();
    }
    const left = lvl >= 10 ? "NIVEAU MAXIMUM" : `${(hi + 1 - FACEIT.elo).toLocaleString("fr-FR")} ELO AVANT LE NIVEAU ${lvl + 1}`;
    text(left, 1786, 362, 11, col, { align: "right", alpha: re * ease(seg(t, 3.1, 3.6)), spacing: 1.5 });
    [["K/D", FACEIT.kd], ["VICTOIRES", `${FACEIT.win} %`], ["PARTIES", FACEIT.matches]].forEach(([lab, v], i) => {
      const x = 1364 + i * 150;
      text(lab, x, 392, 11, "#6f98aa", { alpha: re, spacing: 1.5 });
      text(v, x, 424, 22, C.ice, { alpha: re, font: "display", weight: 500 });
    });
    }
  }
  // graphes
  const fk = seg(t, 2.0, 2.7) * live;
  const fe = panel(1340, 500, 470, 250, fk, "FLUX DE DONNÉES");
  if (fe) {
    const shift = Math.floor(t * 8);
    smoothLine(graphA, 1364, 560, 422, 70, C.ion, fe, shift);
    smoothLine(graphB, 1364, 650, 422, 70, C.ember, fe * .9, shift + 11);
  }

  // ---------- onde audio en bas
  const wk = ease(seg(t, .4, 1.2)) * live;
  if (wk > 0) {
    let lv = .25 + .2 * Math.sin(t * 3);
    if (analyser) { analyser.getByteFrequencyData(freqData); lv = freqData.slice(2, 40).reduce((a, b) => a + b, 0) / (38 * 255) * 2.2 + .12; }
    ctx.save(); ctx.globalAlpha = wk; ctx.globalCompositeOperation = "lighter";
    [[C.ion, 0, 1], [C.ember, 1.7, .6]].forEach(([col, ph, amp]) => {
      ctx.strokeStyle = rgba(col, .7); ctx.lineWidth = 1.6; ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.beginPath();
      for (let x = 0; x <= 760; x += 6) {
        const u = x / 760, env = Math.sin(Math.PI * u);
        const y = 1010 + env * 22 * amp * lv * (Math.sin(u * 18 + t * 5 + ph) + .5 * Math.sin(u * 41 - t * 7));
        x === 0 ? ctx.moveTo(CX - 380 + x, y) : ctx.lineTo(CX - 380 + x, y);
      }
      ctx.stroke();
    });
    ctx.restore();
  }

  // ---------- fin : tout se replie en un point, éclair horizontal
  if (outK > 0) {
    const k = seg(t, D - .5, D - .1);
    if (k > 0) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      const w = 1920 * out3(k), a = Math.sin(Math.PI * k);
      const g = ctx.createLinearGradient(CX - w / 2, 0, CX + w / 2, 0); g.addColorStop(0, rgba(C.ion, 0)); g.addColorStop(.5, rgba(C.ice, a)); g.addColorStop(1, rgba(C.ion, 0));
      ctx.fillStyle = g; ctx.fillRect(CX - w / 2, CY - 1.5, w, 3); ctx.restore();
    }
  }
  // fondu final
  const fade = seg(t, D - .25, D);
  if (fade > 0) { ctx.fillStyle = rgba(C.void, fade); ctx.fillRect(-ox / sc, -oy / sc, W / sc, H / sc); }
}

// ---------- deuxième écran : le noyau part d'ici et file vers la droite
function frameSide(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.void; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, ox * dpr, oy * dpr);
  const outK = seg(t, D - 1.4, D - 0.25), live = 1 - ease(outK);
  const k = clamp(t / T_CHARGE), travelling = t < T_CHARGE;
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1100);
  bg.addColorStop(0, rgba("#0b2a3c", .45 * live + .08)); bg.addColorStop(1, rgba(C.void, 0));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 1920, 1080);
  const gridK = ease(seg(t, 0, .6)) * live;
  ctx.save(); ctx.globalAlpha = .2 * gridK; ctx.strokeStyle = C.steel;
  for (let i = -16; i <= 16; i++) { ctx.beginPath(); ctx.moveTo(CX + i * 34, 760); ctx.lineTo(CX + i * 210, 1080); ctx.stroke(); }
  ctx.restore();
  ctx.save(); dust.forEach(p => { const y = (p.y - t * p.v + 1080) % 1080; ctx.globalAlpha = p.a * live * gridK; ctx.fillStyle = C.ion; ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, TAU); ctx.fill(); }); ctx.restore();
  const frameK = ease(seg(t, .2, 1.2)) * live;
  ctx.save(); ctx.globalAlpha = frameK; ctx.strokeStyle = rgba(C.ion, .6); ctx.lineWidth = 2;
  [[60, 50, 1, 1], [1860, 50, -1, 1], [60, 1030, 1, -1], [1860, 1030, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.beginPath(); ctx.moveTo(x, y + sy * 70); ctx.lineTo(x, y); ctx.lineTo(x + sx * 70, y); ctx.stroke(); });
  ctx.strokeStyle = rgba(C.ion, .25); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(150, 100); ctx.lineTo(1770, 100); ctx.stroke();
  ctx.restore();
  text("JARVIS  //  UNITÉ SECONDAIRE", 150, 78, 14, C.ion, { spacing: 2, alpha: frameK, weight: 500 });
  text(new Date().toLocaleTimeString("fr-FR"), 1770, 72, 22, C.ice, { align: "right", alpha: frameK, font: "display", weight: 500 });

  // socle de départ : anneaux qui tournent puis s'apaisent quand le noyau est parti
  const dockA = ease(seg(t, 0, .5)) * live * (travelling ? 1 : .55);
  const spin = t * .35;
  arc(300, 0, TAU, C.steel, 2, dockA * .8);
  [[262, 1.1, .9, C.ion, 2], [248, -.7, 2.2, C.steel, 6], [358, -.18, 1.6, C.ember, 2]].forEach(([r, v, len, col, w], i) => {
    const a0 = spin * v * 2 + i * 1.7;
    for (let q = 0; q < 3; q++) arc(r, a0 + q * TAU / 3, a0 + q * TAU / 3 + len * .5, col, w, dockA * .8);
  });
  // rail vers la droite (vers l'écran principal)
  const railA = (1 - ease(seg(t, T_CHARGE + .2, T_CHARGE + .9))) * ease(seg(t, 0, .35));
  const TX = k2 => lerp(CX, 2200, clamp(k2 / .5)), TY = k2 => CY - 60 * Math.sin(Math.PI * clamp(k2 / .5) / 2);
  const tx = TX(k), ty = TY(k), on = travelling && k < .5;
  if (railA > 0) {
    ctx.save(); ctx.globalAlpha = railA;
    ctx.strokeStyle = rgba(C.steel, .55); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(CX + 330, CY); ctx.lineTo(1920, CY); ctx.stroke();
    for (let x = CX + 330; x <= 1920; x += 32) { const big = Math.round((x - CX) / 32) % 5 === 0; ctx.strokeStyle = rgba(big ? C.ion : C.steel, big ? .6 : .45); ctx.beginPath(); ctx.moveTo(x, CY - (big ? 9 : 4)); ctx.lineTo(x, CY + (big ? 9 : 4)); ctx.stroke(); }
    const g = ctx.createLinearGradient(CX + 330, 0, 1920, 0); g.addColorStop(0, rgba(C.ion, .1)); g.addColorStop(1, C.ion);
    ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.shadowColor = C.ion; ctx.shadowBlur = 14; ctx.beginPath(); ctx.moveTo(CX + 330, CY); ctx.lineTo(Math.max(CX + 330, Math.min(1920, tx)), CY); ctx.stroke();
    ctx.restore();
    text("TRANSFERT DU NOYAU  →  ÉCRAN PRINCIPAL", 1880, CY + 270, 12, C.ion, { align: "right", spacing: 2.5, alpha: railA * .9, weight: 500 });
  }
  // le noyau qui s'en va
  if (on && img.complete && img.naturalWidth) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    stream.forEach(p => { const back = ((p.d - 380) / 520) * .18; const kk = clamp(k - back); const x = TX(kk) - 20, y = TY(kk) + (p.a / TAU - .5) * 120 * (back / .18);
      ctx.strokeStyle = rgba(C.ion, .6 * (1 - back / .18)); ctx.lineWidth = p.w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 30 * p.s, y); ctx.stroke(); });
    ctx.restore();
    const size = 2 * 205 * lerp(.6, .7, k * 2);
    for (let gI = 3; gI >= 1; gI--) { const kk = clamp(k - gI * .03), gs = size * (1 - gI * .06);
      ctx.save(); ctx.globalAlpha = .12 * (4 - gI) / 3; ctx.translate(TX(kk), TY(kk)); ctx.rotate(-t * .9); ctx.drawImage(img, -gs / 2, -gs / 2, gs, gs); ctx.restore(); }
    ctx.save(); ctx.translate(tx, ty); ctx.rotate(-t * .9); ctx.drawImage(img, -size / 2, -size / 2, size, size); ctx.restore();
    const rr = size * .62;
    ctx.save(); ctx.strokeStyle = C.ion; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.shadowColor = C.ion; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(tx, ty, rr, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(.001, k)); ctx.stroke(); ctx.restore();
    text(`${Math.round(k * 100)} %`, tx, ty + rr + 46, 34, C.ice, { align: "center", font: "display", weight: 500, glow: 14 });
    text("CHARGEMENT", tx, ty + rr + 80, 12, C.ion, { align: "center", spacing: 3 });
  }
  // état au centre
  const st = travelling ? (k < .5 ? "NOYAU EN TRANSIT" : "NOYAU TRANSFÉRÉ") : "NOYAU TRANSFÉRÉ";
  if (!on) text(st, CX, CY, 22, travelling ? C.ion : C.ember, { align: "center", spacing: 6, alpha: live * ease(seg(t, .3, .8)), weight: 500 });
  text("UNITÉ SECONDAIRE", CX, 862, 40, C.ice, { align: "center", font: "display", weight: 500, spacing: 14, alpha: live * ease(seg(t, T_CHARGE + .4, T_CHARGE + 1.2)), glow: 12 });

  // panneaux : liaisons + réseau
  const lk = seg(t, 1.7, 2.4) * live;
  const le = panel(110, 170, 470, 230, lk, "LIAISONS");
  if (le) [["DISCORD", 2.6, "OUVERT ICI"], ["FACEIT", 3.1, "ÉCRAN PRINCIPAL"], ["MICRO", 3.5, "À L'ÉCOUTE"]].forEach(([lab, at, v], i) => {
    const y = 232 + i * 52, kk = seg(t, at, at + .45), done = t > at + .45;
    text(lab, 134, y, 16, done ? C.ice : "#6f98aa", { alpha: le, spacing: 2, weight: 500 });
    ctx.save(); ctx.globalAlpha = le; ctx.fillStyle = rgba(C.steel, .6); ctx.fillRect(280, y - 1, 120, 2); ctx.fillStyle = C.ion; ctx.fillRect(280, y - 1, 120 * ease(kk), 2); ctx.restore();
    if (done) text(v, 556, y, 13, i === 0 ? C.ember : C.ion, { align: "right", alpha: le, spacing: 1.2, weight: 500 });
  });
  const rk = seg(t, 1.9, 2.6) * live;
  const re = panel(1340, 170, 470, 230, rk, "RÉSEAU");
  if (re) { const sh = Math.floor(t * 8); smoothLine(graphB, 1364, 220, 422, 60, C.ion, re, sh + 5); smoothLine(graphA, 1364, 300, 422, 60, C.ember, re * .9, sh + 23); }
  const fade = seg(t, D - .25, D);
  if (fade > 0) { ctx.fillStyle = rgba(C.void, fade); ctx.fillRect(-ox / sc, -oy / sc, W / sc, H / sc); }
}
const render = t => ROLE === "side" ? frameSide(t) : frame(t);

// ---------- lecture
let start = null, running = false;
const veil = document.getElementById("veil"), hint = document.getElementById("hint");
function loop(now) {
  if (!running) return;
  const t = Math.min(D, (now - start) / 1000);
  render(t);
  if (t >= D) { running = false; if (!AUTO) hint.hidden = false; return; }
  requestAnimationFrame(loop);
}
function play() {
  veil.hidden = true; hint.hidden = true; seed = 7;
  bootSound();
  start = performance.now(); running = true; requestAnimationFrame(loop);
}
const ready = Promise.all([document.fonts ? document.fonts.load('500 40px "Oxanium"').catch(() => {}) : 0,
                           img.decode ? img.decode().catch(() => {}) : 0]);
if (AUTO) {
  // lancé par Jarvis : écran noir, on prévient qu'on est prêt, puis départ à l'heure commune (t0) donnée par Jarvis
  veil.hidden = true; document.body.style.cursor = "none";
  document.title = `Intro Jarvis ${ROLE}`;           // Jarvis retrouve la fenêtre par ce titre
  ctx.fillStyle = C.void; ctx.fillRect(0, 0, cv.width, cv.height);
  ready.finally(async () => {
    let t0 = null;
    for (let i = 0; i < 200 && t0 === null; i++) {
      try { const r = await fetch(`sync?role=${ROLE}`, { cache: "no-store" }); const j = await r.json(); if (j.t0) t0 = j.t0; } catch (e) {}
      if (t0 === null) await new Promise(r => setTimeout(r, 50));
    }
    if (t0 === null) t0 = Date.now();
    const tick = () => { const t = (Date.now() - t0) / 1000; if (t < 0) { requestAnimationFrame(tick); return; }
      render(Math.min(D, t)); if (t < D + 2) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
} else {
  document.getElementById("play").addEventListener("click", play);
  document.getElementById("full").addEventListener("click", () => { document.documentElement.requestFullscreen?.().catch(() => {}); });
  cv.addEventListener("click", () => { if (!running) play(); });
  ready.finally(() => render(4.2));
  addEventListener("resize", () => { if (!running) render(4.2); });
}
</script>
